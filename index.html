<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orbit — AI 채팅</title>
    <meta
      name="description"
      content="생각을 정리하고 새로운 가능성을 탐색하는 한국어 AI 채팅 프론트엔드."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <svg class="sprite" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <symbol id="spark" viewBox="0 0 24 24">
          <path d="M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z" />
        </symbol>
        <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
        <symbol id="panel" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="16" rx="3" />
          <path d="M9 4v16" />
        </symbol>
        <symbol id="chat" viewBox="0 0 24 24">
          <path d="M21 11a8 8 0 0 1-8 8H5l-3 3V11a9 9 0 0 1 19 0z" />
        </symbol>
        <symbol id="chevron" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4" /></symbol>
        <symbol id="arrow-up" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6" /></symbol>
        <symbol id="copy" viewBox="0 0 24 24">
          <rect x="8" y="8" width="12" height="13" rx="2" />
          <path d="M15 8V3H3v12h5" />
        </symbol>
        <symbol id="code" viewBox="0 0 24 24">
          <path d="m7 7-5 5 5 5m10-10 5 5-5 5m-3-14-4 18" />
        </symbol>
        <symbol id="pen" viewBox="0 0 24 24"><path d="m4 16 12-12 4 4L8 20H4zm10-10 4 4" /></symbol>
        <symbol id="bulb" viewBox="0 0 24 24">
          <path d="M9 18h6m-5 3h4M8 14a7 7 0 1 1 8 0l-1 2H9z" />
        </symbol>
        <symbol id="book" viewBox="0 0 24 24">
          <path d="M12 6c-3-3-7-3-10-2v15c3-1 7-1 10 2 3-3 7-3 10-2V4c-3-1-7-1-10 2zm0 0v15" />
        </symbol>
        <symbol id="sun" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2" />
        </symbol>
      </defs>
    </svg>
    <div id="overlay"></div>
    <aside id="sidebar" aria-label="대화 탐색">
      <div class="side-top">
        <a class="brand" href="./" aria-label="Orbit 홈"
          ><span class="brand-mark">o</span> orbit<span class="brand-dot">.</span></a
        ><button class="icon-button" id="close-sidebar" aria-label="사이드바 닫기">
          <svg><use href="#panel" /></svg>
        </button>
      </div>
      <button id="new-chat" class="new-chat">
        <svg><use href="#plus" /></svg>새 대화<span>⌘ K</span>
      </button>
      <div class="history-label">내 대화 <span id="chat-count">0</span></div>
      <nav id="history" aria-label="대화 목록"></nav>
      <div id="history-empty">새로운 생각은<br />한 번의 대화에서 시작돼요.</div>
      <div class="side-bottom">
        <div class="demo-note">
          <svg><use href="#spark" /></svg>
          <div>프론트엔드 프리뷰<small>실제 AI 연결 전 데모 모드</small></div>
        </div>
        <button id="theme-toggle" class="profile" aria-label="화면 테마 변경">
          <span class="avatar">나</span><span>나의 작업 공간<small>개인 공간</small></span
          ><svg><use href="#sun" /></svg>
        </button>
      </div>
    </aside>
    <main>
      <header>
        <div class="header-left">
          <button id="open-sidebar" class="icon-button" aria-label="사이드바 열기">
            <svg><use href="#panel" /></svg></button
          ><span class="model-name">Orbit <span>AI</span></span
          ><span class="mode-pill">데모</span>
        </div>
        <span class="header-note">당신의 생각, 그다음 가능성</span
        ><span class="header-avatar">나</span>
      </header>
      <div class="workspace" id="workspace">
        <section id="welcome" class="welcome">
          <div class="welcome-mark">
            <svg><use href="#spark" /></svg>
          </div>
          <div class="eyebrow">A SPACE FOR YOUR THOUGHTS</div>
          <h1>어떤 생각을 함께 나눌까요?</h1>
          <p>작은 궁금증부터 새로운 아이디어까지.</p>
          <div class="suggestions">
            <button data-prompt="새로운 프로젝트 아이디어를 함께 정리해줘">
              <svg class="purple"><use href="#bulb" /></svg><strong>아이디어 떠올리기</strong
              ><span>생각의 시작이 필요할 때</span></button
            ><button data-prompt="내가 쓴 글을 더 자연스럽게 다듬고 싶어">
              <svg class="blue"><use href="#pen" /></svg><strong>글 다듬기</strong
              ><span>마음을 전하는 좋은 문장</span></button
            ><button data-prompt="복잡한 개념을 쉽게 이해하는 방법을 알려줘">
              <svg class="orange"><use href="#book" /></svg><strong>쉽게 이해하기</strong
              ><span>복잡한 것을 명료하게</span></button
            ><button data-prompt="코딩 문제를 함께 해결하고 싶어">
              <svg class="green"><use href="#code" /></svg><strong>코드 함께 보기</strong
              ><span>막힌 부분을 풀어가는 시간</span>
            </button>
          </div>
        </section>
        <section id="messages" aria-label="채팅 메시지" aria-live="polite"></section>
      </div>
      <div class="composer-area">
        <form id="composer">
          <label class="sr-only" for="prompt">메시지</label
          ><textarea
            id="prompt"
            placeholder="무엇이든 물어보세요"
            rows="1"
            maxlength="12000"
          ></textarea>
          <div class="composer-bottom">
            <span class="composer-hint"
              ><svg><use href="#spark" /></svg>함께 생각하는 공간</span
            >
            <div class="input-actions">
              <span>Shift + Enter 줄바꿈</span
              ><button id="send" type="submit" aria-label="메시지 보내기" disabled>
                <svg><use href="#arrow-up" /></svg>
              </button>
            </div>
          </div>
        </form>
        <p class="disclaimer">현재 응답은 UI 확인용 데모입니다. 대화는 이 탭에서만 유지됩니다.</p>
      </div>
    </main>
    <div id="toast" role="status"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
